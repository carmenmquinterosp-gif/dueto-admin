<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DueTo Admin</title>
  <!-- Tailwind CSS & Html5Qrcode Scanner Universal (Android + iOS) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


  <style>
    :root {
      --terracota: #E2725B;
      --sand-gold: #EAC086;
      --dark-teal: #006666;
      --silver-gray: #B5B5B5;
      --light-mint: #D4F7EC;
    }
    body { background-color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; }
    .swipe-item { transition: transform 0.2s ease; }
    .badge-price { background-color: var(--light-mint); color: var(--dark-teal); border: 1px solid var(--dark-teal); }
  </style>
</head>
<body class="pb-20">


  <!-- AUTH PIN MODAL -->
  <div id="pinModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-xl">
      <h2 class="text-2xl font-bold text-slate-800 mb-2">DueTo Admin</h2>
      <p class="text-sm text-slate-500 mb-4">Ingresa tu PIN de Acceso</p>
      <input type="password" id="pinInput" maxlength="4" placeholder="••••" class="text-center text-3xl tracking-widest w-full py-3 border border-slate-300 rounded-xl mb-4 focus:ring-2 focus:ring-teal-600 outline-none">
      <button onclick="login()" class="w-full py-3 bg-[#006666] text-white font-semibold rounded-xl hover:bg-teal-800 transition">Ingresar</button>
    </div>
  </div>


  <!-- HEADER -->
  <header class="bg-[#006666] text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg">DueTo Admin</h1>
      <p class="text-xs text-teal-100" id="syncStatus">Conectando...</p>
    </div>
    <button onclick="refreshData()" class="p-2 bg-teal-800 rounded-lg text-xs">🔄 Sincronizar</button>
  </header>


  <!-- MAIN CONTAINER -->
  <main class="p-4 max-w-md mx-auto">


    <!-- SECCIÓN 1: INVENTARIO -->
    <section id="sec-inventario" class="tab-content">
      <h2 class="font-bold text-slate-700 text-lg mb-3">Inventario Disponible</h2>
      <div id="gridInventario" class="space-y-3"></div>
    </section>


    <!-- SECCIÓN 2: COMPRAS -->
    <section id="sec-compras" class="tab-content hidden">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-slate-700 text-lg">Histórico de Compras</h2>
        <button onclick="openFormCompra()" class="bg-[#E2725B] text-white px-3 py-1.5 rounded-lg text-sm font-bold">+ Nueva Compra</button>
      </div>
      <div id="listCompras" class="space-y-3"></div>
    </section>


    <!-- SECCIÓN 3: VENTAS -->
    <section id="sec-ventas" class="tab-content hidden">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-slate-700 text-lg">Ventas Registradas</h2>
        <button onclick="openFormVenta()" class="bg-[#006666] text-white px-3 py-1.5 rounded-lg text-sm font-bold">+ Nueva Venta</button>
      </div>
      <div id="listVentas" class="space-y-3"></div>
    </section>


    <!-- SECCIÓN 4: ABONOS & CLIENTES -->
    <section id="sec-abonos" class="tab-content hidden">
      <h2 class="font-bold text-slate-700 text-lg mb-3">Gestión de Abonos</h2>
      
      <!-- Paso 1: Selección de Cliente -->
      <div class="bg-white p-4 rounded-xl shadow-sm border mb-4">
        <label class="text-xs font-semibold text-slate-500">Paso 1: Identificar Cliente</label>
        <select id="selectClienteAbono" onchange="loadClientAbonoData()" class="w-full p-2.5 border rounded-lg mt-1 text-sm">
          <option value="">-- Seleccionar Cliente --</option>
        </select>
        
        <div id="infoClienteBox" class="hidden mt-3 p-3 bg-slate-50 rounded-lg text-xs space-y-1">
          <p><strong>Teléfono:</strong> <span id="clientTel"></span></p>
          <p><strong>ID Cliente:</strong> <span id="clientId"></span></p>
          <p class="text-red-600 font-bold"><strong>Saldo Deudor:</strong> $<span id="clientSaldo"></span> MXN</p>
        </div>
      </div>


      <!-- Paso 2: Registro de Pago -->
      <div id="formAbonoStep2" class="bg-white p-4 rounded-xl shadow-sm border hidden">
        <label class="text-xs font-semibold text-slate-500">Paso 2: Registrar Pago</label>
        <div class="space-y-3 mt-2">
          <input type="number" id="montoAbono" placeholder="Monto a abonar (MXN)" class="w-full p-2.5 border rounded-lg text-sm">
          <select id="metodoPagoAbono" class="w-full p-2.5 border rounded-lg text-sm">
            <option value="Efectivo">Efectivo</option>
            <option value="Transferencia">Transferencia</option>
            <option value="Tarjeta">Tarjeta</option>
          </select>
          <button onclick="procesarAbono()" class="w-full py-3 bg-[#006666] text-white font-bold rounded-lg text-sm">Registrar y Enviar por WhatsApp</button>
        </div>
      </div>
    </section>


  </main>


  <!-- NAVBAR INFERIOR -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t flex justify-around py-2 z-30 text-xs font-medium text-slate-600">
    <button onclick="switchTab('inventario')" class="flex flex-col items-center">📦 <span>Inventario</span></button>
    <button onclick="switchTab('compras')" class="flex flex-col items-center">🛒 <span>Compras</span></button>
    <button onclick="switchTab('ventas')" class="flex flex-col items-center">🏷️ <span>Vender</span></button>
    <button onclick="switchTab('abonos')" class="flex flex-col items-center">💳 <span>Abonos</span></button>
  </nav>


  <!-- MODAL DE CAMARA / SCANNER -->
  <div id="scannerModal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col justify-between p-4">
    <div class="text-white text-center text-sm font-bold pt-4">Apunta al Código de Barras</div>
    <div id="reader" class="w-full max-w-sm mx-auto overflow-hidden rounded-xl"></div>
    <button onclick="closeScanner()" class="w-full py-3 bg-red-600 text-white font-bold rounded-xl mb-4">Cerrar Cámara</button>
  </div>


  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxbD9-CzZqxRhr28TzEkB52XCi6fpOiNmtmky_Ef2yWnXHcD60xzqvyehA3UOFDoebRtw/exec";
    let CURRENT_PIN = "";
    let APP_DATA = {};
    let html5QrcodeScanner = null;
    let activeScanTarget = null;


    function login() {
      CURRENT_PIN = document.getElementById("pinInput").value;
      document.getElementById("pinModal").classList.add("hidden");
      refreshData();
    }


    function switchTab(tab) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
      document.getElementById("sec-" + tab).classList.remove("hidden");
    }


    async function refreshData() {
      document.getElementById("syncStatus").innerText = "Cargando...";
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "GET_ALL_DATA", pin: CURRENT_PIN })
        });
        const json = await res.json();
        if (json.success) {
          APP_DATA = json.data;
          document.getElementById("syncStatus").innerText = "Sincronizado";
          renderInventario();
          renderCompras();
          renderVentas();
          populateClientsSelect();
        } else {
          alert("Error: " + json.error);
        }
      } catch (e) {
        document.getElementById("syncStatus").innerText = "Error de conexión";
      }
    }


    function renderInventario() {
      const container = document.getElementById("gridInventario");
      container.innerHTML = "";
      const inv = APP_DATA.INVENTARIO_DISPONIBLE || [];
      inv.forEach(item => {
        container.innerHTML += `
          <div class="bg-white p-3 rounded-xl shadow-sm border flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <img src="${item.Foto_Producto || 'https://via.placeholder.com/50'}" class="w-12 h-12 object-cover rounded-lg border">
              <div>
                <h4 class="font-bold text-slate-800 text-sm">${item.Nombre_Producto}</h4>
                <p class="text-xs text-slate-500">Vendidos: ${item.Total_Vendido} | Stock: ${item.Existencia_Disponible}</p>
              </div>
            </div>
            <span class="badge-price px-2.5 py-1 rounded-full text-xs font-bold">$${item.Costo_Aterrizado_MXN || 0} MXN</span>
          </div>
        `;
      });
    }


    function populateClientsSelect() {
      const select = document.getElementById("selectClienteAbono");
      select.innerHTML = '<option value="">-- Seleccionar Cliente --</option>';
      (APP_DATA.CLIENTES || []).forEach(c => {
        select.innerHTML += `<option value="{c.Nombre_Cliente}</option>`;
      });
    }


    function loadClientAbonoData() {
      const id = document.getElementById("selectClienteAbono").value;
      const client = (APP_DATA.CLIENTES || []).find(c => String(c.ID_Cliente) === String(id));
      if (client) {
        document.getElementById("clientTel").innerText = client.Telefono_WhatsApp || "N/A";
        document.getElementById("clientId").innerText = client.ID_Cliente;
        document.getElementById("clientSaldo").innerText = client.Saldo_Deudor_MXN || 0;
        document.getElementById("infoClienteBox").classList.remove("hidden");
        document.getElementById("formAbonoStep2").classList.remove("hidden");
      }
    }


    async function procesarAbono() {
      const idClient = document.getElementById("selectClienteAbono").value;
      const monto = Number(document.getElementById("montoAbono").value);
      const metodo = document.getElementById("metodoPagoAbono").value;
      const client = (APP_DATA.CLIENTES || []).find(c => String(c.ID_Cliente) === String(idClient));


      const saldoActual = Number(client.Saldo_Deudor_MXN || 0);
      const saldoRestante = Math.max(0, saldoActual - monto);


      const payload = {
        action: "SAVE_ABONO",
        pin: CURRENT_PIN,
        idCliente: idClient,
        montoAbono: monto,
        metodoPago: metodo,
        saldoRestante: saldoRestante
      };


      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
      const json = await res.json();


      if (json.success) {
        // Enviar WhatsApp en texto simple
        const msg = encodeURIComponent(`Hola ${client.Nombre_Cliente}, recibí tu pago de

{saldoRestante} MXN. ¡Gracias!`);
        window.open(`https://wa.me/{msg}`, '_blank');
        refreshData();
      }
    }


    function renderCompras() { /* Lógica de Swipe-to-delete y listado */ }
    function renderVentas() { /* Lógica de Swipe-to-delete y listado */ }
    function openFormCompra() {}
    function openFormVenta() {}
    function closeScanner() { document.getElementById("scannerModal").classList.add("hidden"); }
  </script>
</body>
</html>
