<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DueTo Market Admin</title>
  <!-- Tailwind CSS, Html5Qrcode Scanner Universal y Canvas -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --terracota: #E2725B;
      --sand-gold: #EAC086;
      --dark-teal: #006666;
      --silver-gray: #B5B5B5;
      --light-mint: #D4F7EC;
    }
    body { background-color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; }
    .bg-teal-custom { background-color: var(--dark-teal); }
    .bg-terracota { background-color: var(--terracota); }
    .bg-gold { background-color: var(--sand-gold); }
    .badge-price { background-color: var(--light-mint); color: var(--dark-teal); border: 1px solid var(--dark-teal); }
  </style>
</head>
<body class="pb-24">

  <!-- MODAL PIN DE ACCESO -->
  <div id="pinModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-xl border-t-4 border-[#E2725B]">
      <img src="https://lh3.googleusercontent.com/d/1MNNiJuT_Jf0jKULwf6bt2Vu6ZsFAd47d" alt="DueTo Market" class="h-16 mx-auto mb-3 object-contain">
      <h2 class="text-xl font-bold text-slate-800 mb-1">DueTo Market Admin</h2>
      <p class="text-xs text-slate-500 mb-4">Ingresa tu PIN de Acceso</p>
      <input type="password" id="pinInput" maxlength="4" placeholder="••••" class="text-center text-3xl tracking-widest w-full py-3 border border-slate-300 rounded-xl mb-4 focus:ring-2 focus:ring-[#006666] outline-none">
      <button onclick="login()" class="w-full py-3 bg-[#006666] text-white font-semibold rounded-xl hover:bg-teal-800 transition">Ingresar</button>
    </div>
  </div>

  <!-- HEADER CON LOGO DE DUETO MARKET -->
  <header class="bg-[#006666] text-white p-3 sticky top-0 z-30 shadow-md flex justify-between items-center border-b-2 border-[#EAC086]">
    <div class="flex items-center space-x-3">
      <img src="https://lh3.googleusercontent.com/d/1MNNiJuT_Jf0jKULwf6bt2Vu6ZsFAd47d" alt="Logo" class="h-10 bg-white rounded-lg p-1 object-contain border border-[#EAC086]">
      <div>
        <h1 class="font-bold text-base leading-tight text-[#EAC086]">DueTo Market</h1>
        <p class="text-[10px] text-teal-100 flex items-center gap-1" id="syncStatus">
          <span class="w-2 h-2 rounded-full bg-amber-400 inline-block" id="syncDot"></span> Conectando...
        </p>
      </div>
    </div>
    <button onclick="refreshData()" class="px-3 py-1.5 bg-[#E2725B] text-white font-bold rounded-lg text-xs hover:bg-orange-600 transition shadow">
      🔄 Sincronizar
    </button>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="p-4 max-w-md mx-auto">

    <!-- TAB 1: INVENTARIO -->
    <section id="sec-inventario" class="tab-content">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-slate-700 text-base">Inventario Disponible</h2>
        <span class="text-xs bg-teal-100 text-[#006666] font-bold px-2.5 py-1 rounded-full" id="countInv">0 ítems</span>
      </div>
      <div id="gridInventario" class="space-y-3"></div>
    </section>

    <!-- TAB 2: COMPRAS -->
    <section id="sec-compras" class="tab-content hidden">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-slate-700 text-base">Histórico de Compras</h2>
        <button onclick="openFormCompra()" class="bg-[#E2725B] text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow">+ Nueva Compra</button>
      </div>
      <div id="listCompras" class="space-y-3"></div>
    </section>

    <!-- TAB 3: VENTAS -->
    <section id="sec-ventas" class="tab-content hidden">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-slate-700 text-base">Ventas Registradas</h2>
        <button onclick="openFormVenta()" class="bg-[#006666] text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow">+ Nueva Venta</button>
      </div>
      <div id="listVentas" class="space-y-3"></div>
    </section>

    <!-- TAB 4: ABONOS DE CLIENTES -->
    <section id="sec-abonos" class="tab-content hidden">
      <h2 class="font-bold text-slate-700 text-base mb-3">Gestión de Abonos</h2>
      
      <!-- Paso 1: Selección de Cliente -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
        <label class="text-xs font-semibold text-slate-500">Paso 1: Identificar Cliente</label>
        <select id="selectClienteAbono" onchange="loadClientAbonoData()" class="w-full p-2.5 border rounded-lg mt-1 text-sm bg-slate-50">
          <option value="">-- Seleccionar Cliente --</option>
        </select>
        
        <div id="infoClienteBox" class="hidden mt-3 p-3 bg-teal-50/60 rounded-lg text-xs space-y-1 border border-teal-200">
          <p><strong>Teléfono:</strong> <span id="clientTel"></span></p>
          <p><strong>ID Cliente:</strong> <span id="clientId"></span></p>
          <p class="text-red-600 font-bold text-sm mt-1"><strong>Saldo Deudor:</strong> $<span id="clientSaldo"></span> MXN</p>
        </div>
      </div>

      <!-- Paso 2: Registro de Pago -->
      <div id="formAbonoStep2" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 hidden">
        <label class="text-xs font-semibold text-slate-500">Paso 2: Registrar Pago</label>
        <div class="space-y-3 mt-2">
          <input type="number" id="montoAbono" placeholder="Monto a abonar (MXN)" class="w-full p-2.5 border rounded-lg text-sm">
          <select id="metodoPagoAbono" class="w-full p-2.5 border rounded-lg text-sm bg-slate-50">
            <option value="Efectivo">Efectivo</option>
            <option value="Transferencia">Transferencia</option>
            <option value="Tarjeta">Tarjeta</option>
          </select>
          <button onclick="procesarAbono()" class="w-full py-3 bg-[#006666] text-white font-bold rounded-lg text-sm hover:bg-teal-800 transition">
            Registrar y Enviar por WhatsApp
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- NAVBAR INFERIOR NATIVO -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 flex justify-around py-2.5 z-30 text-xs font-medium text-slate-600 shadow-lg">
    <button onclick="switchTab('inventario')" class="flex flex-col items-center hover:text-[#006666]">📦 <span class="text-[10px] mt-0.5">Inventario</span></button>
    <button onclick="switchTab('compras')" class="flex flex-col items-center hover:text-[#E2725B]">🛒 <span class="text-[10px] mt-0.5">Compras</span></button>
    <button onclick="switchTab('ventas')" class="flex flex-col items-center hover:text-[#006666]">🏷️ <span class="text-[10px] mt-0.5">Vender</span></button>
    <button onclick="switchTab('abonos')" class="flex flex-col items-center hover:text-[#006666]">💳 <span class="text-[10px] mt-0.5">Abonos</span></button>
  </nav>

  <!-- MODAL COMPRAS -->
  <div id="modalCompra" class="fixed inset-0 bg-slate-900/70 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-slate-800">Registrar Compra / Entrada</h3>
        <button onclick="closeFormCompra()" class="text-slate-400 font-bold text-lg">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="font-semibold text-slate-600">ID / Número de Ticket Proveedor</label>
          <input type="text" id="compraTicket" placeholder="Ej: T-9812" class="w-full p-2.5 border rounded-lg mt-1 text-sm">
        </div>
        <div>
          <label class="font-semibold text-slate-600">Tienda</label>
          <input type="text" id="compraTienda" placeholder="Ej: WalMart / Sam's" class="w-full p-2.5 border rounded-lg mt-1 text-sm">
        </div>
        <div class="flex gap-2">
          <div class="w-1/2">
            <label class="font-semibold text-slate-600">Tipo Cambio MXN</label>
            <input type="number" id="compraTC" value="18.5" step="0.1" class="w-full p-2.5 border rounded-lg mt-1 text-sm">
          </div>
          <div class="w-1/2">
            <label class="font-semibold text-slate-600">Código de Barras</label>
            <div class="flex gap-1 mt-1">
              <input type="text" id="compraCodigo" placeholder="Código" class="w-full p-2 border rounded-lg text-sm">
              <button onclick="openScanner('compraCodigo')" class="bg-slate-800 text-white p-2 rounded-lg text-xs">📷</button>
            </div>
          </div>
        </div>
        <div>
          <label class="font-semibold text-slate-600">Nombre Producto</label>
          <input type="text" id="compraNombre" placeholder="Nombre del artículo" class="w-full p-2.5 border rounded-lg mt-1 text-sm">
        </div>
        <div class="flex gap-2">
          <div class="w-1/2">
            <label class="font-semibold text-slate-600">Cantidad</label>
            <input type="number" id="compraCant" value="1" class="w-full p-2.5 border rounded-lg mt-1 text-sm">
          </div>
          <div class="w-1/2">
            <label class="font-semibold text-slate-600">Precio USD</label>
            <input type="number" id="compraPrecioUSD" step="0.01" placeholder="0.00" class="w-full p-2.5 border rounded-lg mt-1 text-sm">
          </div>
        </div>
        <button onclick="guardarCompra()" class="w-full py-3 bg-[#E2725B] text-white font-bold rounded-xl text-sm shadow mt-2">Guardar Compra</button>
      </div>
    </div>
  </div>

  <!-- MODAL VENTAS -->
  <div id="modalVenta" class="fixed inset-0 bg-slate-900/70 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-slate-800">Registrar Venta</h3>
        <button onclick="closeFormVenta()" class="text-slate-400 font-bold text-lg">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="font-semibold text-slate-600">Cliente</label>
          <select id="ventaCliente" class="w-full p-2.5 border rounded-lg mt-1 text-sm bg-slate-50"></select>
        </div>
        <div>
          <label class="font-semibold text-slate-600">Código o Producto</label>
          <div class="flex gap-1 mt-1">
            <input type="text" id="ventaCodigo" placeholder="Código de barras" class="w-full p-2 border rounded-lg text-sm">
            <button onclick="openScanner('ventaCodigo')" class="bg-slate-800 text-white p-2 rounded-lg text-xs">📷</button>
          </div>
        </div>
        <div class="flex gap-2">
          <div class="w-1/2">
            <label class="font-semibold text-slate-600">Cantidad</label>
            <input type="number" id="ventaCant" value="1" class="w-full p-2.5 border rounded-lg mt-1 text-sm">
          </div>
          <div class="w-1/2">
            <label class="font-semibold text-slate-600">Precio MXN</label>
            <input type="number" id="ventaPrecioMXN" placeholder="0.00" class="w-full p-2.5 border rounded-lg mt-1 text-sm">
          </div>
        </div>
        <div class="flex gap-2">
          <div class="w-1/2">
            <label class="font-semibold text-slate-600">Tipo Venta</label>
            <select id="ventaTipo" class="w-full p-2.5 border rounded-lg mt-1 text-sm bg-slate-50">
              <option value="Contado">Contado</option>
              <option value="Crédito">Crédito</option>
            </select>
          </div>
          <div class="w-1/2">
            <label class="font-semibold text-slate-600">Método Pago</label>
            <select id="ventaMetodo" class="w-full p-2.5 border rounded-lg mt-1 text-sm bg-slate-50">
              <option value="Efectivo">Efectivo</option>
              <option value="Transferencia">Transferencia</option>
            </select>
          </div>
        </div>
        <button onclick="guardarVenta()" class="w-full py-3 bg-[#006666] text-white font-bold rounded-xl text-sm shadow mt-2">Registrar Venta</button>
      </div>
    </div>
  </div>

  <!-- MODAL ESCÁNER -->
  <div id="scannerModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-between p-4">
    <div class="text-white text-center text-sm font-bold pt-4">Apunta al Código de Barras</div>
    <div id="reader" class="w-full max-w-sm mx-auto overflow-hidden rounded-xl border-2 border-[#EAC086]"></div>
    <button onclick="closeScanner()" class="w-full py-3 bg-red-600 text-white font-bold rounded-xl mb-4">Cerrar Cámara</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxbD9-CzZqxRhr28TzEkB52XCi6fpOiNmtmky_Ef2yWnXHcD60xzqvyehA3UOFDoebRtw/exec";
    let CURRENT_PIN = "1234";
    let APP_DATA = {};
    let html5QrcodeScanner = null;
    let activeScanInput = null;

    function login() {
      CURRENT_PIN = document.getElementById("pinInput").value;
      document.getElementById("pinModal").classList.add("hidden");
      refreshData();
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
      document.getElementById("sec-" + tab).classList.remove("hidden");
    }

    async function refreshData() {
      const syncStatus = document.getElementById("syncStatus");
      const syncDot = document.getElementById("syncDot");
      syncStatus.innerText = "Cargando...";
      syncDot.className = "w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse";

      try {
        const response = await fetch(API_URL + "?action=GET_ALL_DATA");
        const json = await response.json();
        
        if (json.success) {
          APP_DATA = json.data;
          syncStatus.innerText = "Sincronizado";
          syncDot.className = "w-2 h-2 rounded-full bg-emerald-400 inline-block";
          renderInventario();
          renderCompras();
          renderVentas();
          populateClientsSelect();
        } else {
          syncStatus.innerText = "Error: " + json.error;
          syncDot.className = "w-2 h-2 rounded-full bg-red-500 inline-block";
        }
      } catch (e) {
        syncStatus.innerText = "Error de conexión";
        syncDot.className = "w-2 h-2 rounded-full bg-red-500 inline-block";
      }
    }

    function renderInventario() {
      const container = document.getElementById("gridInventario");
      container.innerHTML = "";
      const inv = APP_DATA.INVENTARIO_DISPONIBLE || [];
      document.getElementById("countInv").innerText = inv.length + " ítems";

      if(inv.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">No hay inventario registrado</p>';
        return;
      }

      inv.forEach(item => {
        container.innerHTML += `
          <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <img src="${item.Foto_Producto || 'https://via.placeholder.com/60'}" class="w-12 h-12 object-cover rounded-lg border">
              <div>
                <h4 class="font-bold text-slate-800 text-xs">${item.Nombre_Producto}</h4>
                <p class="text-[11px] text-slate-500">Vendidos: ${item.Total_Vendido || 0} | Stock: <strong class="text-slate-700">${item.Existencia_Disponible || 0}</strong></p>
              </div>
            </div>
            <span class="badge-price px-2.5 py-1 rounded-full text-xs font-bold">$${item.Costo_Aterrizado_MXN || 0} MXN</span>
          </div>
        `;
      });
    }

    function renderCompras() {
      const container = document.getElementById("listCompras");
      container.innerHTML = "";
      const compras = APP_DATA.COMPRAS || [];
      if(compras.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">Sin compras registradas</p>';
        return;
      }
      compras.forEach(c => {
        container.innerHTML += `
          <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center text-xs">
            <div>
              <p class="font-bold text-slate-800">${c.Nombre_Producto}</p>
              <p class="text-slate-500">Ticket: ${c.ID_Compra} | Cant: ${c.Cantidad}</p>
            </div>
            <span class="font-bold text-[#E2725B]">$${c.Total_Compra_MXN || 0} MXN</span>
          </div>
        `;
      });
    }

    function renderVentas() {
      const container = document.getElementById("listVentas");
      container.innerHTML = "";
      const ventas = APP_DATA.VENTAS || [];
      if(ventas.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">Sin ventas registradas</p>';
        return;
      }
      ventas.forEach(v => {
        container.innerHTML += `
          <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center text-xs">
            <div>
              <p class="font-bold text-slate-800">Venta #${v.ID_Venta}</p>
              <p class="text-slate-500">${v.Fecha_Hora || ''}</p>
            </div>
            <span class="font-bold text-[#006666]">$${v.Total_Venta_MXN || 0} MXN</span>
          </div>
        `;
      });
    }

    function populateClientsSelect() {
      const selectAbono = document.getElementById("selectClienteAbono");
      const selectVenta = document.getElementById("ventaCliente");
      selectAbono.innerHTML = '<option value="">-- Seleccionar Cliente --</option>';
      selectVenta.innerHTML = '<option value="">-- Seleccionar Cliente --</option>';
      
      (APP_DATA.CLIENTES || []).forEach(c => {
        selectAbono.innerHTML += `<option value="${c.ID_Cliente}">${c.Nombre_Cliente}</option>`;
        selectVenta.innerHTML += `<option value="${c.ID_Cliente}">${c.Nombre_Cliente}</option>`;
      });
    }

    function loadClientAbonoData() {
      const id = document.getElementById("selectClienteAbono").value;
      const client = (APP_DATA.CLIENTES || []).find(c => String(c.ID_Cliente) === String(id));
      if (client) {
        document.getElementById("clientTel").innerText = client.Telefono_WhatsApp || "N/A";
        document.getElementById("clientId").innerText = client.ID_Cliente;
        document.getElementById("clientSaldo").innerText = client.Saldo_Deudor_MXN || 0;
        document.getElementById("infoClienteBox").classList.remove("hidden");
        document.getElementById("formAbonoStep2").classList.remove("hidden");
      }
    }

    async function procesarAbono() {
      const idClient = document.getElementById("selectClienteAbono").value;
      const monto = Number(document.getElementById("montoAbono").value);
      const metodo = document.getElementById("metodoPagoAbono").value;
      const client = (APP_DATA.CLIENTES || []).find(c => String(c.ID_Cliente) === String(idClient));

      const saldoActual = Number(client.Saldo_Deudor_MXN || 0);
      const saldoRestante = Math.max(0, saldoActual - monto);

      const payload = {
        action: "SAVE_ABONO",
        pin: CURRENT_PIN,
        idCliente: idClient,
        montoAbono: monto,
        metodoPago: metodo,
        saldoRestante: saldoRestante
      };

      await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
      const msg = encodeURIComponent(`Hola ${client.Nombre_Cliente}, recibí tu pago de $${monto} MXN por método ${metodo}. Tu saldo restante en DueTo Market es de $${saldoRestante} MXN. ¡Gracias!`);
      window.open(`https://wa.me/${client.Telefono_WhatsApp}?text=${msg}`, '_blank');
      refreshData();
    }

    function openFormCompra() { document.getElementById("modalCompra").classList.remove("hidden"); }
    function closeFormCompra() { document.getElementById("modalCompra").classList.add("hidden"); }
    function openFormVenta() { document.getElementById("modalVenta").classList.remove("hidden"); }
    function closeFormVenta() { document.getElementById("modalVenta").classList.add("hidden"); }

    async function guardarCompra() {
      const payload = {
        action: "SAVE_COMPRA",
        pin: CURRENT_PIN,
        idCompra: document.getElementById("compraTicket").value,
        tienda: document.getElementById("compraTienda").value,
        tipoCambio: Number(document.getElementById("compraTC").value),
        codigoBarras: document.getElementById("compraCodigo").value,
        nombreProducto: document.getElementById("compraNombre").value,
        cantidad: Number(document.getElementById("compraCant").value),
        precioUSD: Number(document.getElementById("compraPrecioUSD").value)
      };

      await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
      closeFormCompra();
      refreshData();
    }

    async function guardarVenta() {
      const payload = {
        action: "SAVE_VENTA",
        pin: CURRENT_PIN,
        idVenta: "V-" + new Date().getTime(),
        idCliente: document.getElementById("ventaCliente").value,
        codigoBarras: document.getElementById("ventaCodigo").value,
        cantidad: Number(document.getElementById("ventaCant").value),
        precioMXN: Number(document.getElementById("ventaPrecioMXN").value),
        tipoVenta: document.getElementById("ventaTipo").value,
        metodoPago: document.getElementById("ventaMetodo").value,
        totalMXN: Number(document.getElementById("ventaCant").value) * Number(document.getElementById("ventaPrecioMXN").value)
      };

      await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
      closeFormVenta();
      refreshData();
    }

    function openScanner(targetInputId) {
      activeScanInput = targetInputId;
      document.getElementById("scannerModal").classList.remove("hidden");
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          document.getElementById(activeScanInput).value = decodedText;
          closeScanner();
        },
        () => {}
      );
    }

    function closeScanner() {
      if(html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById("scannerModal").classList.add("hidden");
        }).catch(() => {
          document.getElementById("scannerModal").classList.add("hidden");
        });
      } else {
        document.getElementById("scannerModal").classList.add("hidden");
      }
    }
  </script>
</body>
</html>
